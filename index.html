<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Иконка для «На экран Домой» на iPhone -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Цвет строки состояния / адресной строки: светлая и тёмная тема (как поверхность шапки).
         Если тема выбрана вручную, src/utils/theme.ts подставляет нужный цвет в оба тега. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#22211f" media="(prefers-color-scheme: dark)" />
    <!-- Установка на iPhone: открываться без адресной строки, своё название -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Планировщик" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Планировщик жизни</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
