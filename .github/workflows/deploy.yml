# Сборка и публикация сайта на GitHub Pages при каждом пуше в main.
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # можно запустить вручную из вкладки Actions

# Права, которые нужны для публикации на Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация; новая отменяет незаконченную.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Сайт живёт по адресу https://<логин>.github.io/<репозиторий>/ —
      # передаём подпапку в vite.config.ts через BASE_PATH.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
